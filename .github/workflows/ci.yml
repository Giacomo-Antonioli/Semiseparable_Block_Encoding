name: CI

on:
  push:
    branches: [tests]
  pull_request:

jobs:
  matlab:
    name: MATLAB tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b
      - uses: matlab-actions/run-tests@v2
        with:
          select-by-folder: tests
